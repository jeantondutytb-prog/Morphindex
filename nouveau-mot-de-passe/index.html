<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" id="meta-description" content="Définissez un nouveau mot de passe Morphindex.">
  <title id="meta-title">Nouveau mot de passe — Morphindex</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://morphindex.com/nouveau-mot-de-passe/">
  <script>document.documentElement.setAttribute('data-theme', 'dark');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/auth.css?v=5">
</head>
<body>
  <div id="auth-loading" class="auth-loading-overlay" hidden>Chargement…</div>

  <div class="auth-page">
    <header class="auth-header">
      <a href="/" class="auth-logo">Morph<span>index</span></a>
      <div class="auth-header-nav">
        <a href="/login/" class="auth-link-login" data-i18n="nav.login">Connexion</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1 data-i18n="reset.title">Nouveau mot de passe</h1>
        <p class="auth-subtitle" data-i18n="reset.subtitle">Choisis un mot de passe d'au moins 8 caractères.</p>

        <div class="auth-alert auth-alert-error" id="auth-alert" role="alert"></div>

        <form class="auth-form" id="reset-form" novalidate>
          <div class="form-group">
            <label for="password" data-i18n="reset.password">Nouveau mot de passe</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" data-i18n-placeholder="reset.passwordPlaceholder" placeholder="8 caractères minimum">
            <span class="form-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="confirm" data-i18n="reset.confirm">Confirmer le mot de passe</label>
            <input class="form-input" type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8" data-i18n-placeholder="reset.confirmPlaceholder" placeholder="Retape ton mot de passe">
            <span class="form-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-i18n="reset.submit">Enregistrer</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/api/config.js"></script>
  <script type="module">
    import { initAuthPage } from '/assets/auth.js?v=5';
    initAuthPage('reset');
  </script>
</body>
</html>
