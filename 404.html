<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080808">
  <title>Page introuvable — Morphindex</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #080808;
      color: #fafafa;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 12px; letter-spacing: -0.03em; }
    p { color: #a1a1aa; margin-bottom: 28px; max-width: 420px; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 12px;
      background: #fff;
      color: #080808;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #f1f1f1; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
